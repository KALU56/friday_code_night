name: bloc_dio
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.0
  json_annotation: ^4.6.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_bloc: ^8.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.0.0
  coverage: ^1.0.3
  json_serializable: ^6.3.1
  mocktail: ^1.0.0
  test: ^1.16.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
targets:
  $default:
    builders:
      json_serializable:
        options:
          field_rename: snake
          checked: true
